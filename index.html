<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="description" content="每日热量记录:基础代谢、三餐分配、剩余可摄入热量。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>热量记录</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --card2:#f1f3f6; --line:#e2e5ea;
  --txt:#14161a; --dim:#6b7280; --faint:#9aa1ac;
  --ok:#17a673; --warn:#e3a008; --bad:#e2574c; --acc:#4c6ef5;
  --r:16px; --tap:46px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1116; --card:#181b22; --card2:#20242d; --line:#2b3140;
    --txt:#eceef2; --dim:#99a1b0; --faint:#6b7382;
    --ok:#2fbd8a; --warn:#f0b429; --bad:#f4776a; --acc:#7c93f8;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  padding:0 12px calc(32px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto;
  overflow-x:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select{
  background:var(--card2); border:1px solid var(--line); color:var(--txt);
  border-radius:10px; padding:10px 12px; width:100%; min-height:var(--tap);
  font-size:16px; /* 防止 iOS/安卓聚焦缩放 */
}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.muted{color:var(--dim)}
.tiny{font-size:12.5px}
.sm{font-size:14px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

/* ── 顶栏 ── */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px;
  border-bottom:1px solid transparent;transition:border-color .2s
}
header.stuck{border-color:var(--line)}
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{
  width:var(--tap);height:var(--tap);border-radius:12px;background:var(--card);
  border:1px solid var(--line);font-size:18px;display:grid;place-items:center;flex:none
}
.dnav button:active{background:var(--card2)}
#dlabel{flex:1;text-align:center;font-weight:600;font-size:15px;line-height:1.2}
#dlabel small{display:block;color:var(--dim);font-weight:400;font-size:12px}
#today{width:auto;padding:0 12px;font-size:14px;font-weight:600}

/* ── 概览 ── */
.hero{display:flex;align-items:center;gap:14px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--card2)}
.ring .fg{stroke:var(--ok);transition:stroke-dashoffset .45s ease,stroke .3s}
.ring .fg.w{stroke:var(--warn)} .ring .fg.b{stroke:var(--bad)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .ctr b{font-size:27px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1.05}
.ring .ctr span{font-size:11px;color:var(--dim)}
.stats{flex:1;min-width:0;display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.stat:last-child{border:none;padding:0}
.stat i{font-style:normal;color:var(--dim);font-size:13px}
.stat b{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 提醒 ── */
#alerts{display:grid;gap:8px;margin:12px 0}
.alert{display:flex;gap:9px;padding:11px 13px;border-radius:12px;font-size:14px;line-height:1.45;border:1px solid}
.alert span{flex:none}
.a-bad{background:color-mix(in srgb,var(--bad) 13%,transparent);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.a-warn{background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.a-info{background:color-mix(in srgb,var(--acc) 11%,transparent);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.a-ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}

/* ── 餐卡 ── */
.meal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin:10px 0}
.meal.now{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.mhead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.mhead h3{font-size:16px;flex:1;min-width:0}
.mhead .kc{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--dim);white-space:nowrap}
.mhead .kc b{color:var(--txt);font-size:15px}
.mhead .kc.over b{color:var(--bad)}
.bar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden;margin-bottom:11px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s ease,background .3s}
.bar i.w{background:var(--warn)} .bar i.b{background:var(--bad)}
.items{display:grid;gap:1px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border:none}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.item .nm em{font-style:normal;color:var(--faint);font-size:12.5px;margin-left:5px}
.item .k{font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:600;white-space:nowrap}
.item .del{width:34px;height:34px;flex:none;border-radius:9px;color:var(--faint);font-size:17px;display:grid;place-items:center}
.item .del:active{background:var(--card2);color:var(--bad)}
.empty{color:var(--faint);font-size:14px;padding:4px 2px 10px}
.hint{color:var(--dim);font-size:12.5px;margin:-4px 0 10px}

/* 添加区 */
details.add{border-top:1px solid var(--line);padding-top:10px}
details.add>summary{
  list-style:none;min-height:var(--tap);display:flex;align-items:center;justify-content:center;
  gap:7px;border-radius:11px;background:var(--card2);font-size:15px;font-weight:600;color:var(--acc)
}
details.add>summary::-webkit-details-marker{display:none}
details.add[open]>summary{color:var(--dim);font-weight:500;background:transparent;border:1px dashed var(--line)}
.form{display:grid;gap:9px;margin-top:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.lbl{display:grid;gap:5px}
.lbl>i{font-style:normal;font-size:12px;color:var(--dim);padding-left:2px}
.unit{position:relative}
.unit input{padding-right:46px}
.unit b{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;font-weight:500;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--card2);border-radius:99px;
  padding:7px 12px;font-size:13.5px;min-height:36px
}
.chip:active{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn{
  min-height:var(--tap);border-radius:12px;background:var(--acc);color:#fff;
  font-weight:650;font-size:15.5px;width:100%
}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}

/* ── 折叠面板 ── */
details.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
details.panel>summary{
  list-style:none;min-height:52px;display:flex;align-items:center;gap:9px;padding:0 14px;font-weight:600
}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"›";margin-left:auto;color:var(--faint);font-size:20px;transition:transform .2s}
details.panel[open]>summary::after{transform:rotate(90deg)}
details.panel>summary span:first-child{font-size:17px}
.pbody{padding:2px 14px 14px;border-top:1px solid var(--line);display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 分配 */
.split{display:grid;gap:9px}
.srow{display:grid;grid-template-columns:1fr 84px 76px;gap:9px;align-items:center}
.srow>span{font-size:14.5px}
.srow .kc{text-align:right;font-size:13.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.sum{font-size:13px;text-align:right}
.sum.bad{color:var(--bad);font-weight:600}

/* 历史 */
.hist{display:flex;align-items:flex-end;gap:3px;height:110px;position:relative;padding-top:6px}
.hist .lim{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--bad) 60%,transparent)}
.hcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.hcol i{width:100%;max-width:22px;border-radius:4px 4px 2px 2px;background:var(--ok);min-height:2px;display:block}
.hcol i.w{background:var(--warn)} .hcol i.b{background:var(--bad)} .hcol i.z{background:var(--line)}
.hcol u{text-decoration:none;font-size:9.5px;color:var(--faint);line-height:1}
footer{text-align:center;color:var(--faint);font-size:12px;padding:18px 0 4px}
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s;z-index:50;max-width:90vw
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){
  .ring{width:100px;height:100px} .ring .ctr b{font-size:23px}
  .hero{gap:11px} body{padding-left:10px;padding-right:10px}
  .srow{grid-template-columns:1fr 72px 66px}
}
</style>
</head>
<body>

<header>
  <div class="dnav">
    <button id="prev" aria-label="前一天">‹</button>
    <div id="dlabel"></div>
    <button id="today" aria-label="回到今天">今天</button>
    <button id="next" aria-label="后一天">›</button>
  </div>
</header>

<section class="card hero" id="hero">
  <div class="ring">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="bg" cx="60" cy="60" r="52"></circle>
      <circle class="fg" id="ringfg" cx="60" cy="60" r="52"></circle>
    </svg>
    <div class="ctr"><b id="remain">0</b><span id="remainLbl">剩余 kcal</span></div>
  </div>
  <div class="stats">
    <div class="stat"><i>每日上限</i><b id="s-limit">—</b></div>
    <div class="stat"><i>已摄入</i><b id="s-eaten">—</b></div>
    <div class="stat"><i>基础代谢 BMR</i><b id="s-bmr">—</b></div>
    <div class="stat"><i>总消耗 TDEE</i><b id="s-tdee">—</b></div>
  </div>
</section>

<div id="alerts"></div>

<div id="meals"></div>

<details class="panel" id="planPanel">
  <summary><span>🍽️</span>三餐热量分配</summary>
  <div class="pbody">
    <p class="tiny muted" style="margin:0">按比例把每日上限分到各餐,下面的进度条会按这个预算提醒你。</p>
    <div class="split" id="split"></div>
    <div class="sum" id="splitSum"></div>
    <div class="grid2">
      <button class="btn ghost sm" data-preset="30,40,25,5">均衡 30/40/25/5</button>
      <button class="btn ghost sm" data-preset="35,35,20,10">早餐为重</button>
      <button class="btn ghost sm" data-preset="25,35,35,5">晚餐为重</button>
      <button class="btn ghost sm" data-preset="20,30,30,20">少食多餐</button>
    </div>
    <div class="alert a-info" id="planTip"><span>💡</span><div></div></div>
  </div>
</details>

<details class="panel">
  <summary><span>📈</span>最近 14 天</summary>
  <div class="pbody">
    <div class="hist" id="hist"><div class="lim" id="histLim"></div></div>
    <div class="grid2 tiny muted">
      <div>日均摄入 <b id="h-avg" style="color:var(--txt)">—</b></div>
      <div>超标天数 <b id="h-over" style="color:var(--txt)">—</b></div>
    </div>
  </div>
</details>

<details class="panel" id="setPanel">
  <summary><span>⚙️</span>我的身体数据与设置</summary>
  <div class="pbody">
    <div class="grid2">
      <label class="lbl"><i>性别</i>
        <select id="p-gender"><option value="female">女</option><option value="male">男</option></select>
      </label>
      <label class="lbl"><i>年龄(岁)</i>
        <input id="p-age" type="number" inputmode="numeric" min="10" max="99">
      </label>
      <label class="lbl"><i>身高(cm)</i>
        <input id="p-height" type="number" inputmode="decimal" min="100" max="230">
      </label>
      <label class="lbl"><i>体重(kg)</i>
        <input id="p-weight" type="number" inputmode="decimal" min="25" max="250" step="0.1">
      </label>
    </div>
    <label class="lbl"><i>日常活动量</i>
      <select id="p-act">
        <option value="1.2">久坐 · 几乎不运动</option>
        <option value="1.375">轻度 · 每周运动 1–3 次</option>
        <option value="1.55">中度 · 每周运动 3–5 次</option>
        <option value="1.725">高强度 · 每周 6–7 次</option>
        <option value="1.9">极高 · 体力工作/运动员</option>
      </select>
    </label>
    <label class="lbl"><i>目标</i>
      <select id="p-goal">
        <option value="-500">减脂 · 每周约 0.5kg(-500)</option>
        <option value="-300">温和减脂(-300)</option>
        <option value="0">维持体重</option>
        <option value="300">增重/增肌(+300)</option>
      </select>
    </label>
    <label class="lbl"><i>手动指定每日上限(留空则自动计算)</i>
      <div class="unit"><input id="p-manual" type="number" inputmode="numeric" placeholder="自动" min="800" max="6000"><b>kcal</b></div>
    </label>
    <div class="alert a-info"><span>🧮</span><div class="tiny" id="calcNote"></div></div>
    <div class="grid2">
      <button class="btn ghost sm" id="exp">导出数据</button>
      <button class="btn ghost sm" id="imp">导入数据</button>
    </div>
    <button class="btn danger sm" id="clrDay">清空当天记录</button>
    <button class="btn danger sm" id="clrAll">清空全部数据</button>
    <input type="file" id="impFile" accept=".json,application/json" style="display:none">
  </div>
</details>

<footer>
  数据只保存在这台手机的浏览器里 · <span id="swNote"></span><br>
  热量值为常见参考值,仅供日常估算
</footer>

<div class="toast" id="toast"></div>
<datalist id="foodList"></datalist>

  profile:{gender:'female',age:25,height:165,weight:55,act:1.375,goal:-300,manual:null},
  split:{b:30,l:40,d:25,s:5},
  custom:[],
  days:{}
};
let S=load(), view=ymd(new Date());

function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(!r||typeof r!=='object') return structuredClone(DEF);
    return {...structuredClone(DEF),...r,
      profile:{...DEF.profile,...(r.profile||{})},
      split:{...DEF.split,...(r.split||{})},
      custom:Array.isArray(r.custom)?r.custom:[],
      days:r.days&&typeof r.days==='object'?r.days:{}};
  }catch(e){ return structuredClone(DEF); }
}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('保存失败:存储空间已满'); } };

function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
const r0=n=>Math.round(n)||0;
const foods=()=>[...S.custom,...DB];
const findFood=n=>foods().find(f=>f.n===String(n||'').trim());
const day=(k=view)=>(S.days[k]||(S.days[k]={entries:[]}));
const entries=(k=view)=>(S.days[k]?.entries||[]);

/* ═══════════════ 计算 ═══════════════ */
function bmr(){
  const p=S.profile, w=+p.weight||0, h=+p.height||0, a=+p.age||0;
  if(!w||!h||!a) return 0;
  return r0(10*w + 6.25*h - 5*a + (p.gender==='male'?5:-161));
}
const tdee=()=>r0(bmr()*(+S.profile.act||1.2));
function limit(){
  const m=+S.profile.manual;
  if(m>0) return r0(m);
  const t=tdee(); return t? Math.max(r0(t+(+S.profile.goal||0)), 1000) : 0;
}
const eaten=(k=view)=>r0(entries(k).reduce((s,e)=>s+(+e.kcal||0),0));
const mealEaten=(id,k=view)=>r0(entries(k).filter(e=>e.m===id).reduce((s,e)=>s+(+e.kcal||0),0));
const splitSum=()=>MEALS.reduce((s,m)=>s+(+S.split[m.id]||0),0);
const budget=id=>{ const t=splitSum(); return t>0? r0(limit()*(+S.split[id]||0)/t) : 0; };

/* ═══════════════ 渲染 ═══════════════ */
function renderDate(){
  const d=parseYmd(view), t=ymd(new Date());
  const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const diff=Math.round((d-parseYmd(t))/864e5);
  const rel=diff===0?'今天':diff===-1?'昨天':diff===1?'明天':diff<0?`${-diff} 天前`:`${diff} 天后`;
  document.getElementById('dlabel').innerHTML=
    `${d.getMonth()+1}月${d.getDate()}日 ${wd}<small>${rel}</small>`;
  document.getElementById('next').disabled = false;
  document.getElementById('today').style.visibility = diff===0?'hidden':'visible';
}

function renderHero(){
  const L=limit(), E=eaten(), R=L-E, pct=L? E/L : 0;
  const C=2*Math.PI*52, fg=document.getElementById('ringfg');
  fg.style.strokeDasharray=C;
  fg.style.strokeDashoffset=C*(1-Math.min(pct,1));
  fg.className.baseVal='fg'+(pct>1?' b':pct>=.85?' w':'');
  document.getElementById('remain').textContent = L? (R>=0?R:`+${-R}`) : '—';
  document.getElementById('remainLbl').textContent = L? (R>=0?'剩余 kcal':'超出 kcal') : '请先填身体数据';
  document.getElementById('s-limit').textContent = L? `${L} kcal` : '—';
  document.getElementById('s-eaten').textContent = `${E} kcal`;
  document.getElementById('s-bmr').textContent = bmr()? `${bmr()} kcal` : '—';
  document.getElementById('s-tdee').textContent = tdee()? `${tdee()} kcal` : '—';
}

function renderAlerts(){
  const box=document.getElementById('alerts'), A=[];
  const L=limit(), E=eaten(), R=L-E, now=new Date(), isToday=view===ymd(now), h=now.getHours();

  if(!L){
    A.push(['a-warn','⚙️','还没设置身体数据 —— 展开下面「我的身体数据与设置」填好身高体重,就能算出你的每日上限。']);
  }else{
    if(L<bmr()) A.push(['a-warn','⚠️',`每日上限 ${L} 已低于基础代谢 ${bmr()} kcal,长期这样容易掉代谢、脱发乏力。建议把目标调缓一些。`]);
    if(splitSum()!==100) A.push(['a-warn','🍽️',`三餐分配比例合计 ${splitSum()}%,不等于 100%,预算会按比例折算。`]);

    if(R<0) A.push(['a-bad','🚨',`今天已超出 ${-R} kcal。明天可以适当少吃一点,或加一次 30 分钟快走(约消耗 150–200 kcal)。`]);
    else if(L&&E/L>=.85) A.push(['a-warn','🔔',`只剩 ${R} kcal 了,接下来尽量选蔬菜、瘦肉、豆腐这类低热量高饱腹的食物。`]);

    if(isToday){
      const miss=MEALS.filter(m=>m.from&&h>m.to&&mealEaten(m.id)===0);
      if(miss.length) A.push(['a-info','⏰',`还没记录${miss.map(m=>m.name).join('、')}。吃完随手记一下,不然晚上就算不准了。`]);
      const nowMeal=MEALS.find(m=>m.from&&h>=m.from&&h<=m.to);
      if(nowMeal&&mealEaten(nowMeal.id)===0&&budget(nowMeal.id))
        A.push(['a-info',nowMeal.ic,`${nowMeal.name}时间 —— 这一餐的预算是 ${budget(nowMeal.id)} kcal。`]);
      if(h>=21&&E>0&&L&&E/L<.7)
        A.push(['a-warn','🍚',`今天只吃了 ${E} kcal(上限 ${L}),吃太少同样掉肌肉。明天记得把三餐吃够。`]);
      if(h>=20&&R>=0&&E>0&&E/L>=.7&&E/L<=1)
        A.push(['a-ok','✅',`今天控制得不错 —— 摄入 ${E} / ${L} kcal,还剩 ${R}。`]);
    }else if(E>0&&R>=0&&L){
      A.push(['a-ok','✅',`这天摄入 ${E} / ${L} kcal,${R>0?`结余 ${R}`:'刚好达标'}。`]);
    }
  }
  box.innerHTML=A.map(([c,i,t])=>`<div class="alert ${c}"><span>${i}</span><div>${esc(t)}</div></div>`).join('');
}

function renderMeals(){
  const now=new Date(), isToday=view===ymd(now), h=now.getHours();
  document.getElementById('meals').innerHTML = MEALS.map(m=>{
    const B=budget(m.id), E=mealEaten(m.id), pct=B? E/B : 0;
    const act = isToday && m.from && h>=m.from && h<=m.to;
    const list = entries().filter(e=>e.m===m.id);
    return `<section class="meal${act?' now':''}">
      <div class="mhead">
        <span style="font-size:19px">${m.ic}</span>
        <h3>${m.name}</h3>
        <div class="kc${E>B&&B?' over':''}"><b>${E}</b> / ${B||'—'} kcal</div>
      </div>
      <div class="bar"><i class="${pct>1?'b':pct>=.85?'w':''}" style="width:${Math.min(pct,1)*100}%"></i></div>
      ${list.length
        ? `<div class="items">${list.map(e=>`<div class="item">
             <div class="nm">${esc(e.n)}<em>${esc(e.q||'')}</em></div>
             <div class="k">${r0(e.kcal)}</div>
             <button class="del" data-del="${e.id}" aria-label="删除">✕</button>
           </div>`).join('')}</div>
           ${B&&E<B?`<div class="hint">这一餐还可以吃 ${B-E} kcal</div>`:''}
           ${B&&E>B?`<div class="hint" style="color:var(--bad)">超出本餐预算 ${E-B} kcal</div>`:''}`
        : `<div class="empty">还没记录${B?` · 预算 ${B} kcal`:''}</div>`}
      <details class="add" data-meal="${m.id}">
        <summary><span>＋</span>添加食物</summary>
        <div class="form">
          <div class="chips" data-chips></div>
          <label class="lbl"><i>食物(可直接搜索或自己输入)</i>
            <input list="foodList" data-f="n" placeholder="例如:白米饭" autocomplete="off" enterkeyhint="next">
          </label>
          <div class="two">
            <label class="lbl"><i>数量</i>
              <div class="unit"><input data-f="q" type="number" inputmode="decimal" min="0" step="any" value="100"><b data-unit>g</b></div>
            </label>
            <label class="lbl"><i>热量</i>
              <div class="unit"><input data-f="k" type="number" inputmode="numeric" min="0" step="1" placeholder="0" enterkeyhint="done"><b>kcal</b></div>
            </label>
          </div>
          <button class="btn" data-addbtn>加入${m.name}</button>
        </div>
      </details>
    </section>`;
  }).join('');
  document.querySelectorAll('[data-chips]').forEach(fillChips);
}

function fillChips(el){
  const all=[];
  for(const k of Object.keys(S.days).sort().reverse())
    for(const e of S.days[k].entries) if(!all.includes(e.n)) all.push(e.n);
  const picks=(all.length?all:['白米饭','鸡蛋','鸡胸肉','西兰花','苹果','牛奶(全脂)','香蕉','燕麦片(干)']).slice(0,8);
  el.innerHTML=picks.map(n=>`<button class="chip" data-pick="${esc(n)}">${esc(n)}</button>`).join('');
}

function renderSplit(){
  const box=document.getElementById('split');
  box.innerHTML=MEALS.map(m=>`<div class="srow">
      <span>${m.ic} ${m.name}</span>
      <div class="unit"><input data-sp="${m.id}" type="number" inputmode="numeric" min="0" max="100" value="${S.split[m.id]}"><b>%</b></div>
      <div class="kc">${budget(m.id)} kcal</div>
    </div>`).join('');
  const t=splitSum();
  const sEl=document.getElementById('splitSum');
  sEl.textContent=`合计 ${t}%`; sEl.className='sum'+(t!==100?' bad':'');

  const L=limit(), R=L-eaten();
  const now=new Date(), h=now.getHours(), isToday=view===ymd(now);
  const left=MEALS.filter(m=>mealEaten(m.id)===0 && (!isToday || !m.from || h<=m.to));
  const ls=left.reduce((s,m)=>s+(+S.split[m.id]||0),0);
  const tip=document.querySelector('#planTip div');
  if(!L) tip.textContent='填好身体数据后,这里会给出剩余热量的分配建议。';
  else if(R<=0) tip.textContent=`今天额度已用完(超出 ${-R} kcal),剩下的时间建议只喝水或吃点黄瓜、番茄这类几乎零热量的蔬菜。`;
  else if(!left.length||!ls) tip.textContent=`各餐都记完了,今天还结余 ${R} kcal。`;
  else tip.textContent=`还剩 ${R} kcal,建议这样分:`+left.map(m=>`${m.name} ${r0(R*(+S.split[m.id]||0)/ls)}`).join(' · ')+' kcal';
}

function renderHist(){
  const L=limit(), days=[], today=parseYmd(ymd(new Date()));
  for(let i=13;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i); days.push(ymd(d)); }
  const vals=days.map(k=>eaten(k));
  const top=Math.max(L||0,...vals,1)*1.1;
  document.getElementById('hist').innerHTML=
    `<div class="lim" id="histLim" style="bottom:${L?(L/top*100):0}%;display:${L?'block':'none'}"></div>`+
    days.map((k,i)=>{
      const v=vals[i], hp=v/top*100, p=L?v/L:0;
      const cls=!v?'z':p>1?'b':p>=.85?'w':'';
      const d=parseYmd(k);
      return `<div class="hcol" title="${k} · ${v} kcal">
        <i class="${cls}" style="height:${Math.max(hp,v?2:1.5)}%"></i>
        <u>${d.getDate()}</u></div>`;
    }).join('');
  const nz=vals.filter(v=>v>0);
  document.getElementById('h-avg').textContent = nz.length? r0(nz.reduce((a,b)=>a+b,0)/nz.length)+' kcal' : '—';
  document.getElementById('h-over').textContent = L? vals.filter(v=>v>L).length+' 天' : '—';
}

function renderSettings(){
  const p=S.profile;
  document.getElementById('p-gender').value=p.gender;
  document.getElementById('p-age').value=p.age;
  document.getElementById('p-height').value=p.height;
  document.getElementById('p-weight').value=p.weight;
  document.getElementById('p-act').value=p.act;
  document.getElementById('p-goal').value=p.goal;
  document.getElementById('p-manual').value=p.manual??'';
  const g=+p.goal||0;
  document.getElementById('calcNote').textContent = bmr()
    ? `BMR ${bmr()} × 活动系数 ${p.act} = 总消耗 ${tdee()} kcal`+
      (p.manual>0? ` · 你手动指定了上限 ${r0(p.manual)} kcal`
                 : `,${g<0?`减脂 ${g}`:g>0?`增重 +${g}`:'维持'} → 每日上限 ${limit()} kcal`)
    : '填好年龄、身高、体重后自动计算(Mifflin-St Jeor 公式)。';
}

function renderFoodList(){
  document.getElementById('foodList').innerHTML =
    foods().map(f=>`<option value="${esc(f.n)}">${f.u==='p'?`${f.k} kcal/${f.s}`:`${f.k} kcal/100g`}</option>`).join('');
}

function renderAll(){ renderDate(); renderHero(); renderAlerts(); renderMeals(); renderSplit(); renderHist(); renderSettings(); }

/* ═══════════════ 交互 ═══════════════ */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),1900);
}
function shiftDay(n){
  const d=parseYmd(view); d.setDate(d.getDate()+n); view=ymd(d); renderAll();
}
document.getElementById('prev').onclick=()=>shiftDay(-1);
document.getElementById('next').onclick=()=>shiftDay(1);
document.getElementById('today').onclick=()=>{ view=ymd(new Date()); renderAll(); };
addEventListener('scroll',()=>document.querySelector('header').classList.toggle('stuck',scrollY>4),{passive:true});

/* 表单:只重算热量,绝不回写用户正在输入的数量 */
function recalc(form){
  const qEl=form.querySelector('[data-f="q"]'), kEl=form.querySelector('[data-f="k"]'),
        uEl=form.querySelector('[data-unit]'), f=findFood(form.querySelector('[data-f="n"]').value);
  uEl.textContent = f? (f.u==='p'? f.s : 'g') : 'g';
  if(!f) return;                     // 自定义食物:热量由用户自己填,不覆盖
  const raw=qEl.value.trim();
  kEl.value = raw==='' ? '' : r0(f.k*(parseFloat(raw)||0)/(f.u==='p'?1:100));
}
/* 换食物时才填默认数量:单位变了(g↔个/杯)或数量为空才重置,否则保留用户输入 */
function pickFood(form){
  const qEl=form.querySelector('[data-f="q"]'), uEl=form.querySelector('[data-unit]'),
        f=findFood(form.querySelector('[data-f="n"]').value);
  if(f){
    const nu = f.u==='p'? f.s : 'g';
    if(nu!==uEl.textContent || !(parseFloat(qEl.value)>0)) qEl.value = f.u==='p'?1:100;
  }
  recalc(form);
}
document.addEventListener('input',e=>{
  const form=e.target.closest('.form'); if(!form) return;
  if(e.target.matches('[data-f="n"]')) pickFood(form);
  else if(e.target.matches('[data-f="q"]')) recalc(form);   // 只算,不改数量
});
document.addEventListener('change',e=>{
  const form=e.target.closest('.form');
  if(form && e.target.matches('[data-f="n"]')) pickFood(form);
});

function addFood(wrap){
  const meal=wrap.closest('[data-meal]').dataset.meal;
  const nEl=wrap.querySelector('[data-f="n"]'), qEl=wrap.querySelector('[data-f="q"]'),
        kEl=wrap.querySelector('[data-f="k"]'), uEl=wrap.querySelector('[data-unit]');
  const name=nEl.value.trim(), kcal=r0(parseFloat(kEl.value));
  if(!name){ nEl.focus(); return toast('请输入食物名称'); }
  if(!(kcal>0)){
    if(findFood(name) && !(parseFloat(qEl.value)>0)){ qEl.focus(); return toast('请填写数量'); }
    kEl.focus(); return toast('请填写热量 kcal');
  }
  const q=parseFloat(qEl.value), unit=uEl.textContent;
  if(!findFood(name) && q>0 && unit==='g')
    S.custom.unshift({n:name,k:r0(kcal/q*100)}), S.custom.splice(60);
  day().entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    m:meal,n:name,q:q>0?`${+q.toFixed(1)}${unit}`:'',kcal,t:new Date().toTimeString().slice(0,5)});
  save();
  const L=limit(), R=L-eaten();
  renderAll(); renderFoodList();
  toast(L? (R>=0?`已记录 ${kcal} kcal · 还剩 ${R}`:`已记录 · 超出 ${-R} kcal`) : `已记录 ${kcal} kcal`);
}

document.addEventListener('click',e=>{
  const pick=e.target.closest('[data-pick]');
  if(pick){
    const form=pick.closest('.form');
    form.querySelector('[data-f="n"]').value=pick.dataset.pick;
    form.querySelector('[data-f="q"]').value='';
    pickFood(form);
    const q=form.querySelector('[data-f="q"]');
    q.focus(); try{ q.select(); }catch(e){}   // 选中默认值,直接敲数字就是覆盖
    return;
  }
  const add=e.target.closest('[data-addbtn]');
  if(add){ addFood(add.closest('.form')); return; }
  const del=e.target.closest('[data-del]');
  if(del){
    const d=day(); d.entries=d.entries.filter(x=>x.id!==del.dataset.del);
    save(); renderAll(); toast('已删除');
    return;
  }
  const pre=e.target.closest('[data-preset]');
  if(pre){
    const [b,l,d,s]=pre.dataset.preset.split(',').map(Number);
    S.split={b,l,d,s}; save(); renderAll(); toast('已应用分配方案');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[data-f]')){
    e.preventDefault();
    const form=e.target.closest('.form');
    e.target.matches('[data-f="k"]')? addFood(form) : form.querySelector('[data-f="k"]').focus();
  }
});

/* 设置 */
const bind=(id,key,num)=>{
  const el=document.getElementById(id);
  el.addEventListener('change',()=>{
    const v=el.value.trim();
    S.profile[key] = num ? (v===''?null:+v) : v;
    save(); renderAll();
  });
};
bind('p-gender','gender'); bind('p-age','age',1); bind('p-height','height',1);
bind('p-weight','weight',1); bind('p-act','act',1); bind('p-goal','goal',1); bind('p-manual','manual',1);

document.getElementById('split').addEventListener('change',e=>{
  const id=e.target.dataset.sp; if(!id) return;
  S.split[id]=Math.max(0,Math.min(100,+e.target.value||0));
  save(); renderAll();
});

document.getElementById('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`热量记录-${ymd(new Date())}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('已导出 JSON');
};
document.getElementById('imp').onclick=()=>document.getElementById('impFile').click();
document.getElementById('impFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const o=JSON.parse(await f.text());
    if(!o||typeof o!=='object') throw 0;
    if(!confirm('导入会覆盖当前全部数据,继续?')) return;
    localStorage.setItem(KEY,JSON.stringify(o));
    S=load(); renderAll(); renderFoodList(); toast('导入成功');
  }catch(err){ toast('文件格式不对'); }
  e.target.value='';
};
document.getElementById('clrDay').onclick=()=>{
  if(!entries().length) return toast('这天没有记录');
  if(!confirm(`清空 ${view} 的全部记录?`)) return;
  delete S.days[view]; save(); renderAll(); toast('已清空当天');
};
document.getElementById('clrAll').onclick=()=>{
  if(!confirm('清空全部数据(含身体数据和历史记录)?此操作无法撤销。')) return;
  localStorage.removeItem(KEY); S=structuredClone(DEF); renderAll(); renderFoodList(); toast('已重置');
};

/* 跨天自动刷新 */
setInterval(()=>{ renderAlerts(); renderMeals(); }, 60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) renderAll(); });

/* 初始化 */
renderFoodList(); renderAll();
if(!bmr()) document.getElementById('setPanel').open=true;

/* PWA */
const note=document.getElementById('swNote');
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js')
    .then(()=>note.textContent='已支持离线使用')
    .catch(()=>note.textContent='离线功能未启用');
}else{
  note.textContent='可「添加到主屏幕」当 App 用';
}
</script>
</body>
